
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=gym-membership-management-system

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}

# ==========================================
# DATABASE - TiDB Cloud / MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gym_db}?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# SECURITY / JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# TIMEZONE
# ==========================================
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ==========================================
# DEMO / SAMPLE DATA
# ==========================================
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.staff-password=${SEED_STAFF_PASSWORD}
